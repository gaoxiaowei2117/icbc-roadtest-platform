# ICBC 平台 - nginx 配置
# 监听 9443（避开大陆备案要求）
# 正式入口：https://roadtestgo.com（Cloudflare 代理 443 → 回源 9443，Origin CA 证书）
# 公共 location 配置见 /etc/nginx/snippets/icbc-common.conf（仓库 deploy/nginx-icbc-common.conf）
# Cloudflare 真实 IP 见 /etc/nginx/snippets/cloudflare-realip.conf（仓库 deploy/nginx-cloudflare-realip.conf）
#
# 旧的 gogoxoxo.duckdns.org 直连入口已停用（server 块删除）；DNS 记录与 certbot LE
# 证书可另行清理。9443 入站已在腾讯云防火墙限制为仅 Cloudflare 回源。

# ===== 正式域名（Cloudflare 回源，Origin CA 证书，配合 Full-Strict）=====
server {
    listen 9443 ssl http2 default_server;
    listen [::]:9443 ssl http2 default_server;

    server_name roadtestgo.com www.roadtestgo.com;

    ssl_certificate     /etc/ssl/cloudflare/roadtestgo-origin.pem;
    ssl_certificate_key /etc/ssl/private/roadtestgo-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 访客真实 IP（Cloudflare 的 CF-Connecting-IP），见 deploy/nginx-cloudflare-realip.conf。
    include snippets/cloudflare-realip.conf;
    # 本站单独的访问日志（真实 IP），不和同机其他站点混在 access.log 里。
    # /etc/logrotate.d/nginx 的 /var/log/nginx/*.log 规则会按天轮换、保留 14 天。
    access_log /var/log/nginx/roadtestgo.access.log;

    include snippets/icbc-common.conf;
}
