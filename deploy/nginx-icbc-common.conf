# ICBC 平台 - server 块公共部分（被 nginx-icbc.conf 的 server 块 include）
# 安装位置：/etc/nginx/snippets/icbc-common.conf

# ===== 客户端体量（前端 SPA + 抢约截图可能偏大）=====
client_max_body_size 20m;

# 跳转用相对路径，避免把监听端口 9443 拼进 Location（否则根路径跳转会泄漏 :9443 且经 Cloudflare 超时）
absolute_redirect off;

# ===== 根路径跳转到前端 =====
location = / {
    return 302 /booking/;
}

# ===== API 反代 =====
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# ===== 前端 SPA =====
location /booking/ {
    alias /var/www/icbc-platform/;
    try_files $uri $uri/ /booking/index.html;

    # 带 hash 的静态资源可长期缓存（文件名变化即失效）
    location /booking/assets/ {
        alias /var/www/icbc-platform/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 永不缓存，保证发版后老用户立即拿到新引用的 hash 资源，
    # 否则缓存旧 html 会去加载已被删除的旧 bundle → 404 / 页面空白
    location = /booking/index.html {
        alias /var/www/icbc-platform/index.html;
        add_header Cache-Control "no-cache";
    }
}

# ===== 健康检查 =====
location = /health {
    proxy_pass http://127.0.0.1:8000/health;
}
